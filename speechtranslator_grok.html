<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator • Live Mic → Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .live-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .transcript { scrollbar-width: thin; scrollbar-color: #10b981 #f3f4f6; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl">🎤</div>
                <div>
                    <h1 class="text-3xl font-semibold">Voice Translator</h1>
                    <p class="text-emerald-400 text-sm">Live Speech → Recognition → Translation</p>
                </div>
            </div>
            <div id="status" class="px-4 py-2 bg-zinc-900 border border-zinc-800 rounded-3xl text-sm flex items-center gap-x-2">
                <div id="mic-indicator" class="w-3 h-3 bg-red-500 rounded-full live-dot"></div>
                <span id="status-text">Ready • Chrome recommended</span>
            </div>
        </div>

        <div class="bg-zinc-900 rounded-3xl p-6 mb-8 border border-zinc-800">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-2">SPEAKING (Source)</label>
                    <select id="source-lang" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 focus:border-emerald-500">
                        <option value="de-DE">🇩🇪 German</option>
                        <option value="en-US" selected>🇬🇧 English</option>
                        <option value="es-ES">🇪🇸 Spanish</option>
                        <option value="fr-FR">🇫🇷 French</option>
                        <option value="it-IT">🇮🇹 Italian</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-2">TRANSLATING TO</label>
                    <select id="target-lang" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 focus:border-emerald-500">
                        <option value="en" selected>🇬🇧 English</option>
                        <option value="de">🇩🇪 German</option>
                        <option value="es">🇪🇸 Spanish</option>
                        <option value="fr">🇫🇷 French</option>
                        <option value="it">🇮🇹 Italian</option>
                    </select>
                </div>
                <div class="flex items-end gap-3">
                    <button onclick="toggleRecognition()" id="start-btn"
                            class="flex-1 bg-emerald-500 hover:bg-emerald-600 py-4 rounded-3xl font-semibold flex items-center justify-center gap-2">
                        <span id="btn-text">▶️ Start Listening</span>
                    </button>
                    <button onclick="clearHistory()" class="px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-3xl">Clear</button>
                    <button onclick="saveToFile()" class="px-6 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-3xl">💾 Save</button>
                </div>
            </div>

            <div class="mt-6 flex items-center gap-2">
                <input type="checkbox" id="enable-translation" checked class="accent-emerald-500">
                <label for="enable-translation" class="text-sm text-zinc-400 cursor-pointer">
                    Enable translation (MyMemory + fallback)
                </label>
            </div>
        </div>

        <div class="mb-8">
            <div class="flex justify-between mb-3 px-1">
                <div class="flex items-center gap-2 text-sm font-medium">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full live-dot"></div>
                    LIVE
                </div>
                <div id="live-language" class="text-xs px-3 py-1 bg-zinc-900 rounded-3xl">de-DE → en</div>
            </div>
            <div id="live-box" class="min-h-[130px] bg-zinc-900 border border-zinc-700 rounded-3xl p-6 text-lg">
                <div id="live-text" class="italic text-zinc-400">Click “Start Listening” and speak…</div>
            </div>
        </div>

        <div>
            <h2 class="font-medium mb-4 px-1">Conversation History</h2>
            <div id="history" class="space-y-4 max-h-[420px] overflow-y-auto transcript pr-2"></div>
        </div>

        <div class="mt-12 text-center text-xs text-zinc-500">
            Works best in Chrome • MyMemory translation (free, no key) • Press Spacebar to start/stop
        </div>
    </div>

    <script>
        let recognition = null;
        let isListening = false;
        let finalHistory = [];
        let sourceLangCode = 'de-DE';
        let targetLangCode = 'en';

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Web Speech API not supported. Please use Chrome or Edge.");
                return null;
            }
            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.interimResults = true;
            rec.onresult = handleResult;
            rec.onerror = handleError;
            rec.onend = () => { if (isListening) setTimeout(() => recognition?.start(), 400); };
            return rec;
        }

        function handleResult(event) {
            let final = '';
            let interim = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    final += event.results[i][0].transcript + ' ';
                } else {
                    interim += event.results[i][0].transcript;
                }
            }

            const liveEl = document.getElementById('live-text');
            if (final) {
                addToHistory(final.trim());
                liveEl.innerHTML = `<span class="text-emerald-300">${final}</span>`;
            } else if (interim) {
                liveEl.textContent = interim;
            }
        }

        async function translateText(text) {
            if (!text) return '';
            const enable = document.getElementById('enable-translation').checked;
            if (!enable) return '(translation disabled)';

            try {
                // MyMemory (primary)
                const source = sourceLangCode.split('-')[0];
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${targetLangCode}`;
                
                const res = await fetch(url);
                if (!res.ok) throw new Error();
                
                const data = await res.json();
                if (data.responseData?.translatedText) return data.responseData.translatedText;
            } catch (e) {
                console.log("MyMemory failed, trying fallback...");
            }

            // Fallback: LibreTranslate
            try {
                const res = await fetch('https://libretranslate.de/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        q: text,
                        source: sourceLangCode.split('-')[0],
                        target: targetLangCode,
                        format: 'text'
                    })
                });
                const data = await res.json();
                return data.translatedText || text;
            } catch (e) {
                return '(translation service busy – check internet)';
            }
        }

        async function addToHistory(original) {
            if (!original) return;
            const timestamp = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            
            const statusEl = document.getElementById('status-text');
            const oldStatus = statusEl.textContent;
            statusEl.textContent = 'Translating...';

            const translated = await translateText(original);

            statusEl.textContent = oldStatus;

            finalHistory.unshift({ original, translated, timestamp });
            if (finalHistory.length > 30) finalHistory.pop();
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history');
            container.innerHTML = '';

            if (finalHistory.length === 0) {
                container.innerHTML = `<div class="bg-zinc-900 border border-dashed border-zinc-700 rounded-3xl p-10 text-center text-zinc-400">No entries yet.<br><span class="text-xs">Start speaking after pressing the button</span></div>`;
                return;
            }

            finalHistory.forEach(entry => {
                const div = document.createElement('div');
                div.className = 'bg-zinc-900 border border-zinc-700 rounded-3xl p-5 grid md:grid-cols-12 gap-4';
                div.innerHTML = `
                    <div class="md:col-span-5">
                        <div class="text-emerald-400 text-xs mb-1">ORIGINAL • ${entry.timestamp}</div>
                        <p class="leading-relaxed">${entry.original}</p>
                    </div>
                    <div class="md:col-span-2 flex items-center justify-center text-2xl text-emerald-500">→</div>
                    <div class="md:col-span-5">
                        <div class="text-amber-400 text-xs mb-1">TRANSLATED</div>
                        <p class="leading-relaxed text-amber-100">${entry.translated}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function handleError(event) {
            console.error(event);
            document.getElementById('status-text').textContent = `Error: ${event.error}`;
        }

        function toggleRecognition() {
            if (!recognition) recognition = initSpeechRecognition();
            if (!recognition) return;

            const btn = document.getElementById('start-btn');
            const btnText = document.getElementById('btn-text');
            const status = document.getElementById('status-text');

            if (isListening) {
                isListening = false;
                recognition.stop();
                btn.classList.remove('bg-red-500');
                btn.classList.add('bg-emerald-500');
                btnText.textContent = '▶️ Start Listening';
                status.textContent = 'Stopped';
            } else {
                sourceLangCode = document.getElementById('source-lang').value;
                targetLangCode = document.getElementById('target-lang').value;
                recognition.lang = sourceLangCode;

                document.getElementById('live-language').textContent = `${sourceLangCode} → ${targetLangCode}`;

                isListening = true;
                recognition.start();

                btn.classList.remove('bg-emerald-500');
                btn.classList.add('bg-red-500');
                btnText.textContent = '⏹️ Stop Listening';
                status.innerHTML = `<span class="text-emerald-400">🎙️ Listening live...</span>`;
                document.getElementById('live-text').textContent = 'Speak now...';
            }
        }

        function clearHistory() {
            if (confirm('Clear history?')) {
                finalHistory = [];
                renderHistory();
            }
        }

        function saveToFile() {
            if (finalHistory.length === 0) return alert('Nothing to save!');
            
            let content = `Voice Translation - ${new Date().toLocaleString()}\n\n`;
            finalHistory.forEach(e => {
                content += `[${e.timestamp}] ORIGINAL:\n${e.original}\n\nTRANSLATED:\n${e.translated}\n\n---\n\n`;
            });

            const blob = new Blob([content], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `translation-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;
            a.click();
        }

        window.onload = () => {
            renderHistory();
            document.addEventListener('keydown', e => {
                if (e.key === " " && document.activeElement.tagName === "BODY") {
                    e.preventDefault();
                    toggleRecognition();
                }
            });
            console.log('%c✅ Voice Translator ready!', 'color:#10b981');
        };
    </script>
</body>
</html>
